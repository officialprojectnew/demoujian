<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CBT Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="flex h-screen items-center justify-center p-4">

  <div id="global-loader" class="fixed inset-0 bg-gray-900/80 z-[9999] hidden flex-col items-center justify-center backdrop-blur-sm transition-opacity">
    <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4 shadow-lg"></div>
    <p class="text-white font-bold text-lg animate-pulse tracking-wide" id="loader-text">Memproses Login...</p>
  </div>

  <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-gray-100 max-w-md w-full transform transition-all hover:shadow-2xl">
    
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-3 mb-2">
        <img src="https://i.ibb.co.com/hSNKwYh/logo-removebg-preview.png" alt="Logo CBT" class="w-12 h-12 md:w-14 md:h-14 object-contain drop-shadow-sm">
        <h2 class="text-3xl md:text-4xl font-black text-blue-600 tracking-tight">CBT Online</h2>
      </div>
      <p class="text-sm text-gray-500 font-medium mt-2">Silakan masuk menggunakan akun Anda</p>
    </div>

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
        <input type="text" id="username" placeholder="Username NISN" class="w-full p-4 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition text-base font-medium text-gray-800">
      </div>
      
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password" class="w-full p-4 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition text-base font-medium text-gray-800" onkeypress="if(event.key === 'Enter') login()">
      </div>
      
      <button onclick="login()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-600/30 text-lg mt-4 tracking-wide">
        Masuk
      </button>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function showLoader(text = "Memproses Login...") {
      document.getElementById('loader-text').innerText = text;
      document.getElementById('global-loader').classList.remove('hidden');
      document.getElementById('global-loader').classList.add('flex');
    }
    function hideLoader() {
      document.getElementById('global-loader').classList.add('hidden');
      document.getElementById('global-loader').classList.remove('flex');
    }

    async function login() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      
      if(!u || !p) return Swal.fire('Oops!', 'Username dan Password wajib diisi!', 'warning');

      showLoader('Memverifikasi Akun...');
      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: u, password: p })
        });
        const result = await response.json();
        hideLoader();

        if(result.status === 'success') {
          localStorage.setItem('cbt_user', JSON.stringify(result));
          
          Swal.fire({
            title: 'Login Berhasil!',
            text: `Selamat datang, ${result.nama}`,
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            if(result.role === 'admin') window.location.href = 'admin.html';
            else if(result.role === 'guru') window.location.href = 'guru.html';
            else window.location.href = 'siswa.html';
          });
        } else {
          Swal.fire('Gagal Login', result.pesan, 'error');
        }
      } catch(e) {
        hideLoader();
        Swal.fire('Error', 'Gagal terhubung ke server database.', 'error');
      }
    }
  </script>
</body>
</html>
