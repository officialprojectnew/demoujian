<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ujian Sekolah CBT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

  <!-- Halaman Login -->
  <div id="login-page" class="glassmorphism p-8 rounded-2xl shadow-2xl w-full max-w-md transition-all">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">CBT Cerdas</h1>
      <p class="text-gray-500 text-sm mt-2">Masuk ke portal ujian Anda</p>
    </div>

    <!-- Form ID diarahkan ke script.js -->
    <form id="loginForm">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Login Sebagai</label>
        <select id="role" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Username / NIS</label>
        <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
        Masuk
      </button>
      
      <!-- Pesan Notifikasi -->
      <p id="alert-msg" class="text-center mt-3 text-sm font-semibold hidden"></p>
    </form>
  </div>

  <!-- Panggil File Javascript -->
  <script src="script.js"></script>
</body>
</html>
