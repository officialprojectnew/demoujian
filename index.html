<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CBT System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-blue-600">CBT Online</h1>
      <p class="text-sm text-gray-500 mt-1">Silakan masuk menggunakan akun Anda</p>
    </div>

    <form id="loginForm">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Username / NIS</label>
        <input type="text" id="username" placeholder="Masukkan Username atau NIS" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="Masukkan Password" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Masuk</button>
      <p id="alert-msg" class="text-center mt-3 text-sm font-semibold hidden"></p>
    </form>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxQVFWzJg8WqGIHV41YxJazeXaJ0m8NJ65lxFyspj0IkZbn3lWh186UVmzovFemJJ9c/exec'; 

    window.onload = function() {
      const user = JSON.parse(localStorage.getItem('userCBT'));
      if (user) {
        window.location.href = `${user.role}.html`;
      }
    };

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const userVal = document.getElementById('username').value;
      const passVal = document.getElementById('password').value;
      const btnSubmit = document.getElementById('btnSubmit');
      const alertMsg = document.getElementById('alert-msg');

      btnSubmit.innerHTML = "Memproses...";
      btnSubmit.disabled = true;
      alertMsg.classList.add('hidden');
      
      try {
        const payload = { action: 'login', username: userVal, password: passVal };

        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: 'follow'
        });
        
        const result = await response.json();
        btnSubmit.innerHTML = "Masuk";
        btnSubmit.disabled = false;

        if (result.status === 'success') {
          const userData = { role: result.role, nama: result.nama, id: result.id };
          localStorage.setItem('userCBT', JSON.stringify(userData));

          alertMsg.innerText = `Berhasil masuk! Mengalihkan...`;
          alertMsg.className = "text-center mt-3 text-sm font-semibold text-green-500 block";

          setTimeout(() => {
            window.location.href = `${result.role}.html`; 
          }, 500);
        } else {
          alertMsg.innerText = result.pesan;
          alertMsg.className = "text-center mt-3 text-sm font-semibold text-red-500 block";
        }
      } catch (error) {
        btnSubmit.innerHTML = "Masuk";
        btnSubmit.disabled = false;
        alertMsg.innerText = "Error: Cek koneksi / URL Google Script";
        alertMsg.className = "text-center mt-3 text-sm font-semibold text-red-500 block";
      }
    });
  </script>
</body>
</html>
