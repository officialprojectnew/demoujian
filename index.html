<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Portal Ujian Sekolah</title>
  <!-- Tailwind CSS dari CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

  <!-- Halaman Login -->
  <div id="login-page" class="glassmorphism p-8 rounded-2xl shadow-2xl w-full max-w-md transition-all">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">CBT Cerdas</h1>
      <p class="text-gray-500 text-sm mt-2">Masuk ke portal ujian Anda</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Login Sebagai</label>
        <select id="role" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Username / NIS</label>
        <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
        Masuk
      </button>
      <p id="error-msg" class="text-red-500 text-sm text-center mt-3 hidden"></p>
    </form>
  </div>

  <!-- Script untuk memanggil fungsi dari backend (Code.gs) -->
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      const btn = document.querySelector('button[type="submit"]');
      btn.innerHTML = "Memproses...";
      btn.disabled = true;

      // Memanggil fungsi verifikasiLogin di Code.gs
      google.script.run
        .withSuccessHandler(function(response) {
          btn.innerHTML = "Masuk";
          btn.disabled = false;
          
          if(response.status === 'success') {
            alert('Selamat datang, ' + response.nama);
            // Logika untuk menyembunyikan form login dan memunculkan dashboard sesuai role
            // Contoh: tampilkanDashboard(role);
          } else {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.innerText = response.pesan;
            errorMsg.classList.remove('hidden');
          }
        })
        .verifikasiLogin(user, pass, role);
    }
  </script>
</body>
</html>
