<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CBT System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .glassmorphism { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-indigo-800 min-h-screen flex items-center justify-center p-4">

  <div class="glassmorphism p-8 rounded-2xl shadow-2xl w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800">CBT System</h1>
      <p class="text-gray-500 mt-2">Silakan login untuk melanjutkan</p>
    </div>
    
    <!-- Bagian Form di index.html -->
<form id="loginForm">
  <input type="text" id="username" placeholder="Username / NIS" required class="w-full mb-4 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
  <input type="password" id="password" placeholder="Password" required class="w-full mb-6 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
  <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Masuk</button>
  <p id="alert-msg" class="text-center mt-3 text-sm font-semibold hidden"></p>
</form>
  </div>

  <script src="script.js"></script>
</body>
</html>
