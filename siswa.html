<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Siswa - CBT System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="flex flex-col h-screen justify-between">

  <!-- Header Navbar -->
  <div class="bg-white shadow px-8 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-blue-600">CBT Siswa</h1>
    <div class="flex items-center gap-4">
      <div>
        <p class="text-sm font-bold text-right" id="nama-siswa-login">Siswa</p>
        <p class="text-xs text-gray-500 text-right" id="nis-siswa-login">NIS: -</p>
      </div>
      <button onclick="logout()" class="px-4 py-2 bg-red-50 text-red-600 font-bold rounded-lg hover:bg-red-100 text-sm transition">Logout</button>
    </div>
  </div>

  <!-- Konten Utama -->
  <div class="flex-1 p-8 flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-sm border max-w-md w-full text-center">
      <h2 class="text-xl font-bold mb-2">Mulai Ujian</h2>
      <p class="text-sm text-gray-500 mb-6">Masukkan token ujian yang diberikan oleh pengawas atau guru pengampu.</p>
      
      <input type="text" id="token-ujian" placeholder="KODE TOKEN" class="w-full text-center uppercase tracking-widest text-lg font-bold mb-4 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <button onclick="mulaiUjian()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Gabung Ujian</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="bg-white text-center py-3 text-xs text-gray-400 border-t">
    CBT Online System &copy; 2026
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('userCBT'));
    if (!user || user.role !== 'siswa') {
      window.location.href = 'index.html';
    } else {
      document.getElementById('nama-siswa-login').innerText = user.nama;
      document.getElementById('nis-siswa-login').innerText = `NIS: ${user.id}`;
    }

    function logout() {
      localStorage.removeItem('userCBT');
      window.location.href = 'index.html';
    }

    function mulaiUjian() {
      const token = document.getElementById('token-ujian').value.trim();
      if(!token) return alert('Masukkan token ujian terlebih dahulu!');
      alert(`Fitur ujian dengan token "${token}" akan segera dihubungkan ke sistem.`);
    }
  </script>
</body>
</html>
