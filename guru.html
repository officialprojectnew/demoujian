<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Guru Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; background-color: #f3f4f6; }
    .menu-active { background-color: #f0fdf4; color: #16a34a; border-right: 4px solid #16a34a; }
  </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden">

  <!-- Sidebar Guru -->
  <div class="w-64 bg-white shadow-lg flex flex-col h-full">
    <div class="p-6 text-xl font-bold text-green-700 border-b">Panel Guru</div>
    <div class="flex-1 overflow-y-auto py-4">
      <button onclick="switchMenu('guru-buat-soal')" id="btn-guru-buat-soal" class="w-full text-left px-6 py-3 hover:bg-gray-50 menu-active">Buat / Import Soal</button>
      <button onclick="switchMenu('guru-edit-soal')" id="btn-guru-edit-soal" class="w-full text-left px-6 py-3 hover:bg-gray-50">Edit Soal</button>
      <button onclick="switchMenu('guru-rekap-ujian')" id="btn-guru-rekap-ujian" class="w-full text-left px-6 py-3 hover:bg-gray-50">Rekap Ujian</button>
    </div>
    <button onclick="logout()" class="p-4 bg-red-50 text-red-600 font-bold hover:bg-red-100">Logout</button>
  </div>
  
  <!-- Konten Guru -->
  <div class="flex-1 p-8 overflow-y-auto">
    <div id="guru-buat-soal" class="guru-menu block bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-2xl font-bold mb-4">Buat Bank Soal Baru</h2>
      <!-- Form Pembuatan Soal -->
    </div>
    <div id="guru-edit-soal" class="guru-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Edit Soal</h2></div>
    <div id="guru-rekap-ujian" class="guru-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Rekap Ujian Kelas</h2></div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('userCBT'));
    if (!user || user.role !== 'guru') window.location.href = 'index.html';

    function switchMenu(targetId) {
      document.querySelectorAll('.guru-menu').forEach(el => el.classList.replace('block', 'hidden'));
      document.querySelectorAll('[id^="btn-guru"]').forEach(btn => btn.classList.remove('menu-active'));
      document.getElementById(targetId).classList.replace('hidden', 'block');
      document.getElementById('btn-' + targetId).classList.add('menu-active');
    }

    function logout() {
      localStorage.removeItem('userCBT');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
