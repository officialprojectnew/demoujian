<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - CBT System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <div class="w-64 bg-white shadow-lg flex flex-col h-full">
    <div class="p-6 text-xl font-bold text-green-700 border-b">Panel Guru</div>
    <div class="flex-1 p-4 space-y-2">
      <button class="w-full text-left px-4 py-2.5 rounded-lg bg-green-50 text-green-700 font-semibold">Buat Soal Ujian</button>
      <button class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-gray-50 text-gray-600">Daftar Soal</button>
      <button class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-gray-50 text-gray-600">Nilai Siswa</button>
    </div>
    <div class="p-4 border-t">
      <p class="text-xs text-gray-500">Login sebagai:</p>
      <p class="font-bold text-sm mb-3" id="nama-guru-login">Guru</p>
      <button onclick="logout()" class="w-full py-2 bg-red-50 text-red-600 font-bold rounded-lg hover:bg-red-100 transition">Logout</button>
    </div>
  </div>

  <!-- Konten Utama -->
  <div class="flex-1 p-8 overflow-y-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Selamat Datang, <span id="salam-nama-guru">Guru</span>!</h1>
    <div class="bg-white p-6 rounded-xl shadow-sm border">
      <h2 class="text-lg font-bold mb-2">Pusat Pembuatan Soal</h2>
      <p class="text-gray-600 text-sm">Silakan pilih menu di samping untuk mulai membuat soal ujian atau mengelola bank soal.</p>
    </div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('userCBT'));
    if (!user || user.role !== 'guru') {
      window.location.href = 'index.html';
    } else {
      document.getElementById('nama-guru-login').innerText = user.nama;
      document.getElementById('salam-nama-guru').innerText = user.nama;
    }

    function logout() {
      localStorage.removeItem('userCBT');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
