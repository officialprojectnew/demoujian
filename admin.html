<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - CBT System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
    .menu-active { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; font-weight: 600;}
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    /* Style untuk Modal Popup */
    .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
  </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden relative">

  <div class="w-64 bg-white shadow-lg flex flex-col h-full z-10">
    <div class="p-6 text-xl font-bold text-blue-700 border-b flex items-center gap-2">Panel Admin</div>
    <div class="flex-1 overflow-y-auto py-4">
      <button onclick="switchMenu('admin-input-siswa')" id="btn-admin-input-siswa" class="w-full text-left px-6 py-3 hover:bg-gray-50 menu-active transition-colors">Input Siswa</button>
      <button onclick="switchMenu('admin-rekap-siswa')" id="btn-admin-rekap-siswa" class="w-full text-left px-6 py-3 hover:bg-gray-50 transition-colors">Rekap Siswa</button>
      <button onclick="switchMenu('admin-input-guru')" id="btn-admin-input-guru" class="w-full text-left px-6 py-3 hover:bg-gray-50 transition-colors">Input Guru</button>
      <button onclick="switchMenu('admin-rekap-guru')" id="btn-admin-rekap-guru" class="w-full text-left px-6 py-3 hover:bg-gray-50 transition-colors">Rekap Guru</button>
      <button onclick="switchMenu('admin-manajemen-ujian')" id="btn-admin-manajemen-ujian" class="w-full text-left px-6 py-3 hover:bg-gray-50 transition-colors">Manajemen Ujian</button>
      <button onclick="switchMenu('admin-rekap-ujian')" id="btn-admin-rekap-ujian" class="w-full text-left px-6 py-3 hover:bg-gray-50 transition-colors">Rekap Hasil Ujian</button>
    </div>
    <div class="p-4 border-t">
      <div class="mb-3 px-2">
        <p class="text-xs text-gray-500">Login sebagai:</p>
        <p class="font-bold text-sm" id="nama-admin-login">Admin</p>
      </div>
      <button onclick="logout()" class="w-full py-2 bg-red-50 text-red-600 font-bold rounded-lg hover:bg-red-100 transition-colors">Logout</button>
    </div>
  </div>
  
  <div class="flex-1 p-8 overflow-y-auto w-full">
    
    <div id="admin-input-siswa" class="admin-menu block bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Input Data Siswa</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="border border-gray-200 p-5 rounded-xl">
          <h3 class="font-bold mb-4 text-blue-600 border-b pb-2">Input Manual</h3>
          <div class="space-y-3">
            <div><label class="text-sm font-medium">NIS</label><input type="text" id="nis-siswa" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <div><label class="text-sm font-medium">Nama Lengkap</label><input type="text" id="nama-siswa" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <div><label class="text-sm font-medium">Kelas</label><input type="text" id="kelas-siswa" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <div><label class="text-sm font-medium">Password Default</label><input type="text" id="pass-siswa" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <button onclick="simpanSiswa()" id="btn-simpan-siswa" class="w-full mt-2 bg-blue-600 text-white font-semibold px-4 py-2.5 rounded-lg hover:bg-blue-700">Simpan Siswa</button>
          </div>
        </div>
      </div>
    </div>
    
    <div id="admin-rekap-siswa" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Data Rekapan Siswa</h2>
        <button onclick="loadRekapSiswa()" class="bg-blue-100 text-blue-700 font-semibold px-4 py-2 rounded-lg hover:bg-blue-200">Muat Ulang Data</button>
      </div>
      <div class="overflow-x-auto border rounded-lg">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-sm">
              <th class="p-3 border-b text-center">No</th>
              <th class="p-3 border-b">NIS</th>
              <th class="p-3 border-b">Nama Lengkap</th>
              <th class="p-3 border-b">Kelas</th>
              <th class="p-3 border-b">Password</th>
              <th class="p-3 border-b text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-rekap-siswa"><tr><td colspan="6" class="p-4 text-center text-gray-500">Memuat data...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="admin-input-guru" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Input Data Guru</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="border border-gray-200 p-5 rounded-xl">
          <h3 class="font-bold mb-4 text-blue-600 border-b pb-2">Input Manual</h3>
          <div class="space-y-3">
            <div><label class="text-sm font-medium">NIP / ID Guru</label><input type="text" id="nip-guru" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <div><label class="text-sm font-medium">Nama Lengkap Guru</label><input type="text" id="nama-guru" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <div><label class="text-sm font-medium">Username Login</label><input type="text" id="user-guru" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <div><label class="text-sm font-medium">Password Default</label><input type="text" id="pass-guru" class="w-full mt-1 p-2 border rounded-lg outline-none"></div>
            <button onclick="simpanGuru()" id="btn-simpan-guru" class="w-full mt-2 bg-blue-600 text-white font-semibold px-4 py-2.5 rounded-lg hover:bg-blue-700">Simpan Guru</button>
          </div>
        </div>
      </div>
    </div>

    <div id="admin-rekap-guru" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Data Rekapan Guru</h2>
        <button onclick="loadRekapGuru()" class="bg-blue-100 text-blue-700 font-semibold px-4 py-2 rounded-lg hover:bg-blue-200">Muat Ulang Data</button>
      </div>
      <div class="overflow-x-auto border rounded-lg">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-sm">
              <th class="p-3 border-b text-center">No</th>
              <th class="p-3 border-b">NIP/ID</th>
              <th class="p-3 border-b">Nama Guru</th>
              <th class="p-3 border-b">Username</th>
              <th class="p-3 border-b">Password</th>
              <th class="p-3 border-b text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-rekap-guru"><tr><td colspan="6" class="p-4 text-center text-gray-500">Memuat data...</td></tr></tbody>
        </table>
      </div>
    </div>

    </div>

  <div id="modal-edit-siswa" class="fixed inset-0 modal-overlay hidden z-50 flex justify-center items-center">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-xl font-bold text-gray-800">Edit Data Siswa</h3>
        <button onclick="tutupModal('modal-edit-siswa')" class="text-gray-400 hover:text-red-500 font-bold text-xl">&times;</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-sm font-medium text-gray-600">NIS (Tidak bisa diubah)</label>
          <input type="text" id="edit-nis-siswa" disabled class="w-full mt-1 p-2.5 bg-gray-100 border rounded-lg text-gray-500">
        </div>
        <div>
          <label class="text-sm font-medium">Nama Lengkap</label>
          <input type="text" id="edit-nama-siswa" class="w-full mt-1 p-2.5 border rounded-lg outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-sm font-medium">Kelas</label>
          <input type="text" id="edit-kelas-siswa" class="w-full mt-1 p-2.5 border rounded-lg outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-sm font-medium">Password Baru</label>
          <input type="text" id="edit-pass-siswa" class="w-full mt-1 p-2.5 border rounded-lg outline-none focus:border-blue-500">
        </div>
        <div class="pt-3 flex gap-3">
          <button onclick="tutupModal('modal-edit-siswa')" class="flex-1 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg hover:bg-gray-300">Batal</button>
          <button onclick="simpanEditSiswa()" id="btn-simpan-edit-siswa" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700">Simpan Perubahan</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-edit-guru" class="fixed inset-0 modal-overlay hidden z-50 flex justify-center items-center">
    <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-xl font-bold text-gray-800">Edit Data Guru</h3>
        <button onclick="tutupModal('modal-edit-guru')" class="text-gray-400 hover:text-red-500 font-bold text-xl">&times;</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-sm font-medium text-gray-600">NIP/ID (Tidak bisa diubah)</label>
          <input type="text" id="edit-nip-guru" disabled class="w-full mt-1 p-2.5 bg-gray-100 border rounded-lg text-gray-500">
        </div>
        <div>
          <label class="text-sm font-medium">Nama Lengkap Guru</label>
          <input type="text" id="edit-nama-guru" class="w-full mt-1 p-2.5 border rounded-lg outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-sm font-medium">Username Login</label>
          <input type="text" id="edit-user-guru" class="w-full mt-1 p-2.5 border rounded-lg outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-sm font-medium">Password Baru</label>
          <input type="text" id="edit-pass-guru" class="w-full mt-1 p-2.5 border rounded-lg outline-none focus:border-blue-500">
        </div>
        <div class="pt-3 flex gap-3">
          <button onclick="tutupModal('modal-edit-guru')" class="flex-1 bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg hover:bg-gray-300">Batal</button>
          <button onclick="simpanEditGuru()" id="btn-simpan-edit-guru" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700">Simpan Perubahan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    // CEK SESI ADMIN
    const user = checkAuth('admin');
    document.getElementById('nama-admin-login').innerText = user.nama;

    // FUNGSI GANTI MENU
    function switchMenu(targetId) {
      document.querySelectorAll('.admin-menu').forEach(el => el.classList.replace('block', 'hidden'));
      document.querySelectorAll('[id^="btn-admin"]').forEach(btn => btn.classList.remove('menu-active'));
      
      document.getElementById(targetId).classList.replace('hidden', 'block');
      document.getElementById('btn-' + targetId).classList.add('menu-active');

      if(targetId === 'admin-rekap-siswa') loadRekapSiswa();
      if(targetId === 'admin-rekap-guru') loadRekapGuru();
    }

    // FUNGSI KONTROL MODAL (POPUP)
    function tutupModal(idModal) {
      document.getElementById(idModal).classList.add('hidden');
    }

    // ================= FITUR REKAP & EDIT SISWA =================
    async function loadRekapSiswa() {
      const tbody = document.getElementById('tabel-rekap-siswa');
      tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Memuat data dari database...</td></tr>`;
      try {
        const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getSiswa' }) });
        const result = await response.json();
        if(result.data.length === 0) return tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Belum ada data siswa.</td></tr>`;
        
        let html = '';
        result.data.forEach((s, i) => {
          // Escaping quote untuk parameter JS
          let jsData = JSON.stringify(s).replace(/'/g, "\\'");
          html += `<tr class="hover:bg-gray-50 border-b">
            <td class="p-3 text-center text-sm">${i + 1}</td><td class="p-3 text-sm font-medium">${s.nis}</td>
            <td class="p-3 text-sm">${s.nama}</td><td class="p-3 text-sm">${s.kelas}</td>
            <td class="p-3 text-sm font-mono text-gray-500">${s.password}</td>
            <td class="p-3 text-center flex justify-center gap-2">
              <button onclick='bukaEditSiswa(${jsData})' class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded text-sm font-bold hover:bg-yellow-200">Edit</button>
              <button onclick="hapusSiswa('${s.nis}')" class="bg-red-100 text-red-600 px-3 py-1 rounded text-sm font-bold hover:bg-red-200">Hapus</button>
            </td>
          </tr>`;
        });
        tbody.innerHTML = html;
      } catch(e) { tbody.innerHTML = `<tr><td colspan="6" class="text-center text-red-500">Gagal memuat.</td></tr>`; }
    }

    function bukaEditSiswa(dataSiswa) {
      document.getElementById('edit-nis-siswa').value = dataSiswa.nis;
      document.getElementById('edit-nama-siswa').value = dataSiswa.nama;
      document.getElementById('edit-kelas-siswa').value = dataSiswa.kelas;
      document.getElementById('edit-pass-siswa').value = dataSiswa.password;
      document.getElementById('modal-edit-siswa').classList.remove('hidden');
    }

    async function simpanEditSiswa() {
      const data = {
        nis: document.getElementById('edit-nis-siswa').value,
        nama: document.getElementById('edit-nama-siswa').value,
        kelas: document.getElementById('edit-kelas-siswa').value,
        password: document.getElementById('edit-pass-siswa').value
      };
      if(!data.nama || !data.kelas || !data.password) return alert('Nama, Kelas, dan Password tidak boleh kosong!');

      const btn = document.getElementById('btn-simpan-edit-siswa');
      btn.innerText = "Menyimpan..."; btn.disabled = true;

      try {
        const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'editSiswa', data }) });
        const result = await response.json();
        alert(result.pesan);
        if(result.status === 'success') {
          tutupModal('modal-edit-siswa');
          loadRekapSiswa(); // Refresh tabel
        }
      } catch(e) { alert("Gagal mengupdate data."); }
      btn.innerText = "Simpan Perubahan"; btn.disabled = false;
    }

    // ================= FITUR REKAP & EDIT GURU =================
    async function loadRekapGuru() {
      const tbody = document.getElementById('tabel-rekap-guru');
      tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Memuat data guru...</td></tr>`;
      try {
        const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getGuru' }) });
        const result = await response.json();
        if(result.data.length === 0) return tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Belum ada data guru.</td></tr>`;
        
        let html = '';
        result.data.forEach((g, i) => {
          let jsData = JSON.stringify(g).replace(/'/g, "\\'");
          html += `<tr class="hover:bg-gray-50 border-b">
            <td class="p-3 text-center text-sm">${i + 1}</td><td class="p-3 text-sm font-medium">${g.nip}</td>
            <td class="p-3 text-sm">${g.nama}</td><td class="p-3 text-sm">${g.username}</td>
            <td class="p-3 text-sm font-mono text-gray-500">${g.password}</td>
            <td class="p-3 text-center flex justify-center gap-2">
              <button onclick='bukaEditGuru(${jsData})' class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded text-sm font-bold hover:bg-yellow-200">Edit</button>
              <button onclick="hapusGuru('${g.nip}')" class="bg-red-100 text-red-600 px-3 py-1 rounded text-sm font-bold hover:bg-red-200">Hapus</button>
            </td>
          </tr>`;
        });
        tbody.innerHTML = html;
      } catch(e) { tbody.innerHTML = `<tr><td colspan="6" class="text-center text-red-500">Gagal memuat.</td></tr>`; }
    }

    function bukaEditGuru(dataGuru) {
      document.getElementById('edit-nip-guru').value = dataGuru.nip;
      document.getElementById('edit-nama-guru').value = dataGuru.nama;
      document.getElementById('edit-user-guru').value = dataGuru.username;
      document.getElementById('edit-pass-guru').value = dataGuru.password;
      document.getElementById('modal-edit-guru').classList.remove('hidden');
    }

    async function simpanEditGuru() {
      const data = {
        nip: document.getElementById('edit-nip-guru').value,
        nama: document.getElementById('edit-nama-guru').value,
        username: document.getElementById('edit-user-guru').value,
        password: document.getElementById('edit-pass-guru').value
      };
      if(!data.nama || !data.username || !data.password) return alert('Field tidak boleh ada yang kosong!');

      const btn = document.getElementById('btn-simpan-edit-guru');
      btn.innerText = "Menyimpan..."; btn.disabled = true;

      try {
        const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'editGuru', data }) });
        const result = await response.json();
        alert(result.pesan);
        if(result.status === 'success') {
          tutupModal('modal-edit-guru');
          loadRekapGuru(); // Refresh tabel
        }
      } catch(e) { alert("Gagal mengupdate data."); }
      btn.innerText = "Simpan Perubahan"; btn.disabled = false;
    }
  </script>
</body>
</html>
