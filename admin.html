<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: sans-serif; background-color: #f3f4f6; }
    .menu-active { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; }
  </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden">

  <!-- Sidebar Admin -->
  <div class="w-64 bg-white shadow-lg flex flex-col h-full">
    <div class="p-6 text-xl font-bold text-blue-700 border-b">Panel Admin</div>
    <div class="flex-1 overflow-y-auto py-4">
      <button onclick="switchMenu('admin-input-siswa')" id="btn-admin-input-siswa" class="w-full text-left px-6 py-3 hover:bg-gray-50 menu-active">Input Siswa</button>
      <button onclick="switchMenu('admin-rekap-siswa')" id="btn-admin-rekap-siswa" class="w-full text-left px-6 py-3 hover:bg-gray-50">Rekapan Siswa</button>
      <button onclick="switchMenu('admin-input-guru')" id="btn-admin-input-guru" class="w-full text-left px-6 py-3 hover:bg-gray-50">Input Guru</button>
      <button onclick="switchMenu('admin-manajemen-ujian')" id="btn-admin-manajemen-ujian" class="w-full text-left px-6 py-3 hover:bg-gray-50">Manajemen Ujian</button>
      <button onclick="switchMenu('admin-rekap-ujian')" id="btn-admin-rekap-ujian" class="w-full text-left px-6 py-3 hover:bg-gray-50">Rekap Ujian</button>
    </div>
    <button onclick="logout()" class="p-4 bg-red-50 text-red-600 font-bold hover:bg-red-100">Logout</button>
  </div>
  
  <!-- Konten Admin -->
  <div class="flex-1 p-8 overflow-y-auto">
    <!-- Menu Input Siswa -->
    <div id="admin-input-siswa" class="admin-menu block bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-2xl font-bold mb-4">Input Data Siswa</h2>
      <div class="grid grid-cols-2 gap-6">
        <div class="border p-4 rounded-lg">
          <h3 class="font-bold mb-2">Input Manual</h3>
          <input type="text" placeholder="NIS" class="w-full mb-2 p-2 border rounded">
          <input type="text" placeholder="Nama Siswa" class="w-full mb-2 p-2 border rounded">
          <button class="bg-blue-600 text-white px-4 py-2 rounded">Simpan</button>
        </div>
        <div class="border p-4 rounded-lg bg-gray-50">
          <h3 class="font-bold mb-2">Import dari Excel</h3>
          <input type="file" class="block w-full text-sm mb-3">
          <button class="bg-green-600 text-white px-4 py-2 rounded">Import</button>
        </div>
      </div>
    </div>
    
    <div id="admin-rekap-siswa" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Rekapan Siswa</h2></div>
    <div id="admin-input-guru" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Input Data Guru</h2></div>
    <div id="admin-manajemen-ujian" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Manajemen Ujian</h2></div>
    <div id="admin-rekap-ujian" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Rekap Ujian</h2></div>
  </div>

  <script>
    // Proteksi Halaman
    const user = JSON.parse(localStorage.getItem('userCBT'));
    if (!user || user.role !== 'admin') window.location.href = 'index.html';

    function switchMenu(targetId) {
      document.querySelectorAll('.admin-menu').forEach(el => el.classList.replace('block', 'hidden'));
      document.querySelectorAll('[id^="btn-admin"]').forEach(btn => btn.classList.remove('menu-active'));
      document.getElementById(targetId).classList.replace('hidden', 'block');
      document.getElementById('btn-' + targetId).classList.add('menu-active');
    }

    function logout() {
      localStorage.removeItem('userCBT');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
