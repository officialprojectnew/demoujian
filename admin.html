<!-- Konten Admin -->
  <div class="flex-1 p-8 overflow-y-auto">
    <!-- Menu Input Siswa -->
    <div id="admin-input-siswa" class="admin-menu block bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-2xl font-bold mb-4">Input Data Siswa</h2>
      <div class="grid grid-cols-2 gap-6">
        <div class="border p-4 rounded-lg">
          <h3 class="font-bold mb-2">Input Manual</h3>
          <input type="text" id="nis-siswa" placeholder="NIS" class="w-full mb-2 p-2 border rounded">
          <input type="text" id="nama-siswa" placeholder="Nama Lengkap" class="w-full mb-2 p-2 border rounded">
          <input type="text" id="kelas-siswa" placeholder="Kelas (Misal: X IPA 1)" class="w-full mb-2 p-2 border rounded">
          <input type="password" id="pass-siswa" placeholder="Password Default" class="w-full mb-4 p-2 border rounded">
          <button onclick="simpanSiswa()" id="btn-simpan-siswa" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Simpan Siswa</button>
        </div>
        <div class="border p-4 rounded-lg bg-gray-50">
          <h3 class="font-bold mb-2">Import dari Excel</h3>
          <input type="file" class="block w-full text-sm mb-3">
          <button class="bg-green-600 text-white px-4 py-2 rounded">Import</button>
        </div>
      </div>
    </div>
    
    <!-- Menu Input Guru (Sudah dilengkapi) -->
    <div id="admin-input-guru" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-2xl font-bold mb-4">Input Data Guru</h2>
      <div class="grid grid-cols-2 gap-6">
        <div class="border p-4 rounded-lg">
          <h3 class="font-bold mb-2">Input Manual</h3>
          <input type="text" id="nip-guru" placeholder="NIP / ID Guru" class="w-full mb-2 p-2 border rounded">
          <input type="text" id="nama-guru" placeholder="Nama Lengkap Guru" class="w-full mb-2 p-2 border rounded">
          <input type="text" id="user-guru" placeholder="Username Login" class="w-full mb-2 p-2 border rounded">
          <input type="password" id="pass-guru" placeholder="Password Login" class="w-full mb-4 p-2 border rounded">
          <button onclick="simpanGuru()" id="btn-simpan-guru" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Simpan Guru</button>
        </div>
        <div class="border p-4 rounded-lg bg-gray-50">
          <h3 class="font-bold mb-2">Import dari Excel</h3>
          <input type="file" class="block w-full text-sm mb-3">
          <button class="bg-green-600 text-white px-4 py-2 rounded">Import</button>
        </div>
      </div>
    </div>

    <!-- Placeholder Menu Lain -->
    <div id="admin-rekap-siswa" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Rekapan Siswa</h2></div>
    <div id="admin-manajemen-ujian" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Manajemen Ujian</h2></div>
    <div id="admin-rekap-ujian" class="admin-menu hidden bg-white p-6 rounded-xl shadow-sm"><h2 class="text-2xl font-bold">Rekap Ujian</h2></div>
  </div>

  <script>
    // MASUKKAN URL GOOGLE SCRIPT YANG SAMA DENGAN script.js DI SINI
    const GAS_URL = 'MASUKKAN_URL_WEB_APP_ANDA_DISINI';

    // Proteksi Halaman
    const user = JSON.parse(localStorage.getItem('userCBT'));
    if (!user || user.role !== 'admin') window.location.href = 'index.html';

    function switchMenu(targetId) {
      document.querySelectorAll('.admin-menu').forEach(el => el.classList.replace('block', 'hidden'));
      document.querySelectorAll('[id^="btn-admin"]').forEach(btn => btn.classList.remove('menu-active'));
      document.getElementById(targetId).classList.replace('hidden', 'block');
      document.getElementById('btn-' + targetId).classList.add('menu-active');
    }

    function logout() {
      localStorage.removeItem('userCBT');
      window.location.href = 'index.html';
    }

    // --- FUNGSI MENGIRIM DATA KE DATABASE ---

    async function simpanSiswa() {
      const nis = document.getElementById('nis-siswa').value;
      const nama = document.getElementById('nama-siswa').value;
      const kelas = document.getElementById('kelas-siswa').value;
      const password = document.getElementById('pass-siswa').value;
      const btn = document.getElementById('btn-simpan-siswa');

      if(!nis || !nama || !kelas || !password) return alert('Harap isi semua kolom!');

      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const payload = {
        action: 'simpanSiswa',
        data: { nis, nama, kelas, password }
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        alert(result.pesan);
        
        // Kosongkan form jika sukses
        if(result.status === 'success') {
          document.getElementById('nis-siswa').value = '';
          document.getElementById('nama-siswa').value = '';
          document.getElementById('kelas-siswa').value = '';
          document.getElementById('pass-siswa').value = '';
        }
      } catch(e) {
        alert("Gagal menyimpan data. Cek koneksi Anda.");
      }
      btn.innerText = "Simpan Siswa";
      btn.disabled = false;
    }

    async function simpanGuru() {
      const nip = document.getElementById('nip-guru').value;
      const nama = document.getElementById('nama-guru').value;
      const username = document.getElementById('user-guru').value;
      const password = document.getElementById('pass-guru').value;
      const btn = document.getElementById('btn-simpan-guru');

      if(!nip || !nama || !username || !password) return alert('Harap isi semua kolom!');

      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const payload = {
        action: 'simpanGuru',
        data: { nip, nama, username, password }
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        alert(result.pesan);
        
        if(result.status === 'success') {
          document.getElementById('nip-guru').value = '';
          document.getElementById('nama-guru').value = '';
          document.getElementById('user-guru').value = '';
          document.getElementById('pass-guru').value = '';
        }
      } catch(e) {
        alert("Gagal menyimpan data. Cek koneksi Anda.");
      }
      btn.innerText = "Simpan Guru";
      btn.disabled = false;
    }
  </script>
